name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scoring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check required app files
        run: test -f index.html && test -f data/rules.json && test -f js/scoring.js

      - name: Run scoring tests
        run: node --test test/scoring.test.js
