<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Act Scanner — Autoevaluación preliminar de riesgos de IA</title>
  <meta name="description" content="Autoevaluación preliminar de riesgos de IA bajo el Reglamento Europeo de IA (AI Act) para pymes. 100% local: ningún dato sale de tu navegador.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;🛡️&lt;/text&gt;&lt;/svg&gt;">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🛡️</span>
        <div>
          <span class="brand-name" data-i18n="ui.appName">AI Act Scanner</span>
          <span class="brand-tagline" data-i18n="ui.tagline"></span>
        </div>
      </div>
      <div class="lang-toggle" role="group" aria-label="Idioma / Language">
        <button type="button" id="lang-es" class="lang-btn active" aria-pressed="true">ES</button>
        <button type="button" id="lang-en" class="lang-btn" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Intro -->
    <section id="screen-intro" class="screen">
      <h1 data-i18n="ui.introTitle"></h1>
      <p class="lead" data-i18n="ui.introLead"></p>
      <div class="notice notice-privacy">
        <strong data-i18n="ui.privacyTitle"></strong>
        <p data-i18n="ui.privacyBody"></p>
      </div>
      <div class="notice notice-disclaimer">
        <strong data-i18n="ui.disclaimerTitle"></strong>
        <p data-i18n="ui.disclaimerBody"></p>
      </div>
      <button type="button" id="btn-start" class="btn btn-primary btn-lg" data-i18n="ui.start"></button>
    </section>

    <!-- Wizard -->
    <section id="screen-wizard" class="screen" hidden>
      <div class="progress-wrap">
        <span id="progress-label" class="progress-label"></span>
        <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
      </div>
      <form id="question-form" novalidate>
        <fieldset id="question-fieldset">
          <legend id="question-label" class="question-label"></legend>
          <p id="question-hint" class="question-hint" hidden></p>
          <div id="options" class="options"></div>
        </fieldset>
        <p id="validation-msg" class="validation-msg" hidden></p>
        <div class="wizard-nav">
          <button type="button" id="btn-back" class="btn btn-ghost" data-i18n="ui.back"></button>
          <button type="submit" id="btn-next" class="btn btn-primary" data-i18n="ui.next"></button>
        </div>
      </form>
    </section>

    <!-- Report -->
    <section id="screen-report" class="screen" hidden>
      <h1 data-i18n="ui.reportTitle"></h1>
      <div class="overall-card">
        <span class="overall-label" data-i18n="ui.overallLabel"></span>
        <span id="overall-badge" class="badge"></span>
      </div>
      <p id="incomplete-note" class="notice notice-disclaimer" hidden></p>

      <h2 data-i18n="ui.areasTitle"></h2>
      <div id="areas-grid" class="areas-grid"></div>

      <h2 data-i18n="ui.risksTitle"></h2>
      <ul id="risks-list" class="risks-list"></ul>

      <h2 data-i18n="ui.stepsTitle"></h2>
      <ol id="steps-list" class="steps-list"></ol>

      <div class="notice notice-timeline">
        <strong data-i18n="ui.timelineTitle"></strong>
        <p data-i18n="ui.timelineBody"></p>
      </div>

      <div class="cta-card">
        <strong data-i18n="ui.ctaTitle"></strong>
        <p data-i18n="ui.ctaBody"></p>
        <a class="btn btn-primary" href="https://calendly.com/jd-robles" target="_blank" rel="noopener" data-i18n="ui.ctaButton"></a>
      </div>

      <div class="notice notice-disclaimer">
        <strong data-i18n="ui.disclaimerTitle"></strong>
        <p data-i18n="ui.disclaimerBody"></p>
      </div>

      <div class="report-actions">
        <button type="button" id="btn-pdf" class="btn btn-primary" data-i18n="ui.downloadPdf"></button>
        <button type="button" id="btn-restart" class="btn btn-ghost" data-i18n="ui.restart"></button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p data-i18n="ui.footerNote"></p>
      <p>Jose Robles · <a href="https://calendly.com/jd-robles" target="_blank" rel="noopener">calendly.com/jd-robles</a></p>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="js/i18n.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
